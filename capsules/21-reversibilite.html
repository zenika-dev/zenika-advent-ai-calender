        const q = i % 10, ball = (cx, r) => { const u = o.rand() * 2 - 1, a = o.rand() * o.TAU, s = Math.sqrt(1 - u * u), k = r * Math.cbrt(o.rand()); return [cx + k * s * Math.cos(a), k * u, k * s * Math.sin(a), 0]; };

        if (q < 6) return ball(2.4, .6);
        let x = (o.rand() * 2 - 1) * 1.75; x += x < 0 ? -.1 : .1;
        const jag = Math.abs(x) < .45 ? o.gauss() * .12 : o.gauss() * .04;
        return [x, jag, o.gauss() * .04, Math.abs(x) < .7 ? 1 : 0];
      } },
      kicker: "Le scénario",
      titre: "Le modèle que vous utilisez aujourd'hui peut disparaître demain",

    {
      forme: { type: "pile", feuilles: 19, accent: "dessus" },

    },
    {
      forme: { type: "barres", valeurs: [100, 130], accent: [1] },

    },
    {
      forme: { type: "reseau", noeuds: 6, accent: [0], centre: true },
