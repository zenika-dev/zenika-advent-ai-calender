<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avent IA · Zenika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="engine/tokens.css">
<style>
/* Calendrier de l'avent : 24 portes mélangées (ordre fixe), chacune cache une capsule.
   Même langage visuel qu'avant : fond nuit + particules, cartes voilées, chiffres en contour or.
   ?debug : portes toutes ouvrables, rien n'est mémorisé. */
html, body { background: var(--ink); color: var(--paper); }
body { margin: 0; font-family: var(--body); font-size: 16px; -webkit-font-smoothing: antialiased; }
#field {
  position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; display: block;
  background: radial-gradient(ellipse 80% 70% at 75% 10%, var(--navy), var(--ink) 70%);
}
#fx { position: fixed; inset: 0; z-index: 20; width: 100%; height: 100%; pointer-events: none; }
.wrap {
  position: relative; z-index: 1; max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(40px + env(safe-area-inset-top, 0px)) 64px;
  display: flex; flex-direction: column; gap: 48px;
}
.kicker { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-hi); }

header.hero { display: flex; flex-direction: column; gap: 20px; padding-top: 4vh; }
header.hero h1 {
  margin: 0 0 .08em; font-family: var(--display); font-weight: 900; letter-spacing: -.045em; line-height: .9;
  font-size: clamp(52px, 10.5vw, 148px);
}
header.hero .logo { display: block; width: 134px; height: auto; margin-bottom: 8px; }
header.hero h1 span { color: var(--accent-hi); }
.lead { margin: 0; max-width: 44ch; font-size: 18px; line-height: 1.55; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 12px 40px; padding-top: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; color: var(--paper); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }

.status { border-top: 1px solid var(--line); padding-top: 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; min-height: 20px; }
.status p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
.status p b { color: var(--accent-hi); font-weight: 600; }
.debug { display: none; gap: 8px; align-items: center; }
.debug.on { display: flex; }
.debug em { font-style: normal; font: 600 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); background: var(--accent); padding: 6px 8px; border-radius: 2px; }
.debug button {
  font: 500 12px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  background: transparent; border: 1px solid var(--line); border-radius: 2px; padding: 10px 14px; cursor: pointer;
}
.debug button:hover { color: var(--paper); border-color: var(--muted); }

/* ---------- Portes ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 20px; }
.door { position: relative; perspective: 900px; display: grid; min-width: 0; }
.door.shake { animation: nope .45s cubic-bezier(.36, .07, .19, .97); }
@keyframes nope { 15%, 85% { transform: translateX(-3px); } 30%, 70% { transform: translateX(6px); } 50% { transform: translateX(-6px); } }

/* Derrière la porte : la capsule */
.inside {
  position: relative; min-height: 320px; display: flex; flex-direction: column; gap: 12px; padding: 22px 22px 18px;
  border: 1px solid var(--line); border-radius: 2px; overflow: hidden;
  background: radial-gradient(ellipse 90% 70% at 50% 0%, rgba(223, 33, 71, .18), transparent 70%), var(--veil);
  color: inherit; text-decoration: none; transition: border-color .3s, transform .4s cubic-bezier(.2, .8, .2, 1);
}
.inside .n { font-family: var(--display); font-weight: 900; font-size: 56px; line-height: .8; letter-spacing: .01em; transition: color .3s; font-variant-numeric: tabular-nums; }
.inside h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 25px; line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
.inside p { margin: 0; font-size: 14.5px; line-height: 1.55; color: var(--muted); }
.inside .meta { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.inside .arrow { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--accent); transition: transform .3s; }
a.inside:hover { border-color: var(--accent); transform: translateY(-3px); }
a.inside:hover .n { color: var(--accent); }
a.inside:hover .arrow { transform: translateX(4px); }
.inside.soon { align-items: center; justify-content: center; text-align: center; }
.inside.soon .n { font-size: 72px; }

/* Le battant */
.panel {
  position: absolute; inset: 0; margin: 0; padding: 0; cursor: pointer; color: inherit; font: inherit;
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  border: 1px solid var(--line); border-radius: 2px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, .05), transparent 45%),
    linear-gradient(var(--surface), var(--surface));
  transform-origin: left center; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  transition: border-color .3s, box-shadow .3s;
}
.panel::before { /* filet intérieur façon cadre de porte */
  content: ""; position: absolute; inset: 8px; border: 1px solid var(--line); border-radius: 1px; pointer-events: none;
}
.panel::after { /* poignée */
  content: ""; position: absolute; right: 14px; top: 50%; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); opacity: .5; transform: translateY(-50%);
}
.panel .num {
  font-family: var(--display); font-weight: 900; font-size: clamp(64px, 9vw, 96px); line-height: .8; letter-spacing: .01em;
  font-variant-numeric: tabular-nums; transition: color .3s;
}
.panel .tag { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
.door.ready .panel { border-color: rgba(223, 33, 71, .55); animation: pulse 2.6s ease-in-out infinite; }
.door.ready .panel:hover { border-color: var(--accent); }
.door.ready .panel:hover .num { color: var(--accent); }
.door.locked .panel { cursor: not-allowed; }
.door.locked .num { --ol: rgba(223, 33, 71, .4); }
/* Chiffres détourés : un contour par ombres décalées (le tracé -webkit-text-stroke laisse voir les chevauchements de Nunito). */
.panel .num, .inside .n {
  --ol: var(--accent); color: var(--surface);
  text-shadow: 1px 0 var(--ol), -1px 0 var(--ol), 0 1px var(--ol), 0 -1px var(--ol), 1px 1px var(--ol), -1px -1px var(--ol), 1px -1px var(--ol), -1px 1px var(--ol);
}
.door.locked .panel .num { --ol: rgba(223, 33, 71, .4); }
@keyframes pulse { 50% { box-shadow: 0 0 0 1px rgba(223, 33, 71, .25), 0 0 26px rgba(223, 33, 71, .22); } }
.panel:focus-visible, a.inside:focus-visible, footer a:focus-visible, .debug button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Porte ouverte : la carte a disparu, la capsule est visible */
.door.open .panel { opacity: 0; visibility: hidden; pointer-events: none; animation: none; box-shadow: none; }
/* Ouverture : la carte tremble de plus en plus fort, puis explose */
.door.open.opening .panel { opacity: 1; visibility: visible; animation: tremble 1.5s linear forwards; }
@keyframes tremble {
  0% { transform: none; }
  4.0% { transform: translate(0.6px, -0.2px) rotate(-0.11deg) scale(1.002); box-shadow: 0 0 2px rgba(223, 33, 71, 0.03); border-color: var(--accent); }
  8.0% { transform: translate(-0.7px, 0.2px) rotate(0.12deg) scale(1.004); box-shadow: 0 0 3px rgba(223, 33, 71, 0.05); border-color: var(--accent); }
  12.0% { transform: translate(0.8px, 0.3px) rotate(-0.15deg) scale(1.005); box-shadow: 0 0 5px rgba(223, 33, 71, 0.07); border-color: var(--accent); }
  16.0% { transform: translate(-1.0px, -0.3px) rotate(0.19deg) scale(1.007); box-shadow: 0 0 7px rgba(223, 33, 71, 0.10); border-color: var(--accent); }
  20.0% { transform: translate(1.2px, 0.4px) rotate(-0.23deg) scale(1.009); box-shadow: 0 0 9px rgba(223, 33, 71, 0.12); border-color: var(--accent); }
  24.0% { transform: translate(-1.4px, 0.5px) rotate(0.29deg) scale(1.011); box-shadow: 0 0 10px rgba(223, 33, 71, 0.15); border-color: var(--accent); }
  28.0% { transform: translate(1.7px, -0.6px) rotate(-0.36deg) scale(1.013); box-shadow: 0 0 12px rgba(223, 33, 71, 0.18); border-color: var(--accent); }
  32.0% { transform: translate(-2.1px, 0.7px) rotate(0.44deg) scale(1.015); box-shadow: 0 0 14px rgba(223, 33, 71, 0.20); border-color: var(--accent); }
  36.0% { transform: translate(2.4px, 0.9px) rotate(-0.54deg) scale(1.016); box-shadow: 0 0 16px rgba(223, 33, 71, 0.23); border-color: var(--accent); }
  40.0% { transform: translate(-2.9px, -1.0px) rotate(0.64deg) scale(1.018); box-shadow: 0 0 17px rgba(223, 33, 71, 0.25); border-color: var(--accent); }
  44.0% { transform: translate(3.4px, 1.2px) rotate(-0.75deg) scale(1.020); box-shadow: 0 0 19px rgba(223, 33, 71, 0.28); border-color: var(--accent); }
  48.0% { transform: translate(-3.9px, 1.4px) rotate(0.87deg) scale(1.022); box-shadow: 0 0 21px rgba(223, 33, 71, 0.30); border-color: var(--accent); }
  52.0% { transform: translate(4.4px, -1.6px) rotate(-1.01deg) scale(1.024); box-shadow: 0 0 22px rgba(223, 33, 71, 0.33); border-color: var(--accent); }
  56.0% { transform: translate(-5.1px, 1.8px) rotate(1.15deg) scale(1.025); box-shadow: 0 0 24px rgba(223, 33, 71, 0.35); border-color: var(--accent); }
  60.0% { transform: translate(5.7px, 2.0px) rotate(-1.31deg) scale(1.027); box-shadow: 0 0 26px rgba(223, 33, 71, 0.38); border-color: var(--accent); }
  64.0% { transform: translate(-6.4px, -2.2px) rotate(1.48deg) scale(1.029); box-shadow: 0 0 28px rgba(223, 33, 71, 0.40); border-color: var(--accent); }
  68.0% { transform: translate(7.2px, 2.5px) rotate(-1.65deg) scale(1.031); box-shadow: 0 0 29px rgba(223, 33, 71, 0.43); border-color: var(--accent); }
  72.0% { transform: translate(-8.0px, 2.8px) rotate(1.84deg) scale(1.033); box-shadow: 0 0 31px rgba(223, 33, 71, 0.45); border-color: var(--accent); }
  76.0% { transform: translate(8.8px, -3.1px) rotate(-2.04deg) scale(1.035); box-shadow: 0 0 33px rgba(223, 33, 71, 0.48); border-color: var(--accent); }
  80.0% { transform: translate(-9.7px, 3.4px) rotate(2.25deg) scale(1.036); box-shadow: 0 0 35px rgba(223, 33, 71, 0.50); border-color: var(--accent); }
  84.0% { transform: translate(10.6px, 3.7px) rotate(-2.47deg) scale(1.038); box-shadow: 0 0 36px rgba(223, 33, 71, 0.53); border-color: var(--accent); }
  88.0% { transform: translate(-11.6px, -4.1px) rotate(2.70deg) scale(1.040); box-shadow: 0 0 38px rgba(223, 33, 71, 0.55); border-color: var(--accent); }
  94% { transform: scale(1.07); box-shadow: 0 0 60px rgba(255, 190, 205, .9); border-color: var(--accent-hi); filter: brightness(1.6); }
  100% { transform: scale(1.4); opacity: 0; filter: brightness(3); }
}
.door .flash {
  position: absolute; inset: -30%; pointer-events: none; opacity: 0; z-index: 2;
  background: radial-gradient(circle, rgba(255, 190, 205, .95) 0%, rgba(223, 33, 71, .55) 25%, transparent 60%);
}
.door.opening .flash { animation: flash 1s ease-out 1.4s both; }
@keyframes flash { 0% { opacity: 0; transform: scale(.3); } 18% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4); } }
.door.opening .inside { animation: surge 2.2s cubic-bezier(.2, .9, .2, 1.2) both; }
@keyframes surge { 0%, 67% { opacity: 0; transform: scale(.96); filter: brightness(.7); } 68% { opacity: 1; transform: scale(.96); filter: brightness(1.2); } 74% { transform: scale(1.07); filter: brightness(1.8); } 100% { transform: scale(1); filter: none; } }
.door.opening { z-index: 3; }
body.boom .wrap { animation: boom .5s cubic-bezier(.36, .07, .19, .97); }
@keyframes boom { 20% { transform: translate(2px, -2px); } 40% { transform: translate(-3px, 1px); } 60% { transform: translate(2px, 2px); } 80% { transform: translate(-1px, -1px); } }

footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); }
footer a { color: var(--muted); text-underline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .panel, .inside, .inside .n, .inside .arrow { transition: none; }
  .door.ready .panel, .door.shake, .door.opening .flash, .door.opening .inside, body.boom .wrap { animation: none; }
}

/* Easter egg : le Grinch vole une porte (Konami code ou triple clic sur « IA »). */
.door.stolen { opacity: .16; transform: scale(.97); filter: grayscale(1); outline: 1px dashed #6FBF4A; outline-offset: -1px; cursor: pointer; transition: opacity .6s, transform .6s, filter .6s; }
.door.stolen > * { pointer-events: none; }
.door.stolen .panel { animation: none; }
header.hero h1 span { cursor: default; user-select: none; }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="hero">
    <img class="logo" src="engine/img/zenika-logo.svg" alt="Zenika" width="134" height="41">
    <div class="kicker">24 portes · 1 capsule par jour · décembre</div>
    <h1>Avent <span>IA</span></h1>
    <p class="lead">Un calendrier de l'avent pour comprendre l'IA. Chaque jour de décembre, une porte s'ouvre sur une capsule : un concept, quelques faits sourcés, deux minutes.</p>
    <div class="stats" id="stats"></div>
  </header>
  <div class="status">
    <p id="msg" aria-live="polite"></p>
    <div class="debug" id="debug"><em>Debug</em><button type="button" id="openAll">Tout ouvrir</button><button type="button" id="closeAll">Tout refermer</button></div>
  </div>
  <main class="grid" id="grid"></main>
  <footer>
    <span>Capsules IA · Zenika</span>
    <a href="engine/catalogue.html">Catalogue des formes</a>
  </footer>
</div>

<script src="capsules/manifest.js"></script>
<script>
(function () {
  const DOORS = 24;
  const DEBUG = new URLSearchParams(location.search).has("debug");
  const list = (window.CAPSULES || []).slice();
  const byNum = new Map(list.map(c => [c.numero, c]));
  const ms = document.currentScript && document.currentScript.previousElementSibling;   // le bloc qui porte le manifeste
  if (ms && ms.tagName === "SCRIPT" && !ms.src && ms.textContent.includes("window.CAPSULES")) ms.remove();
  try { delete window.CAPSULES; } catch (e) { window.CAPSULES = undefined; }   // pas de liste des capsules à portée de la console
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pad = n => String(n).padStart(2, "0");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const grid = document.getElementById("grid"), msg = document.getElementById("msg");

  // Date du jour : une porte n'est ouvrable qu'en décembre, à partir de son jour.
  // Pour tester en conditions réelles avant décembre : ?mois=11 décale le calendrier sur novembre
  // (les portes s'ouvrent jour par jour selon la vraie date). Sans paramètre : décembre.
  const now = new Date();
  const mParam = parseInt(new URLSearchParams(location.search).get("mois"), 10);
  const M = mParam >= 1 && mParam <= 12 ? mParam - 1 : 11;           // index du mois (11 = décembre)
  const TEST = M !== 11;
  const NOMS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  const ABR = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const MOIS = NOMS[M], MOIS_ABR = ABR[M];
  const KEY = "capsules-avent-" + now.getFullYear() + (TEST ? "-test-" + (M + 1) : "");   // mémoire séparée : ne pollue pas décembre
  const isOpenable = n => DEBUG || (now.getMonth() === M && n <= now.getDate());
  if (TEST) {
    document.querySelector(".hero .kicker").textContent = `24 portes · 1 capsule par jour · ${MOIS} (test)`;
    document.querySelector(".hero .lead").textContent = document.querySelector(".hero .lead").textContent.replace("décembre", MOIS);
  }

  // Mémoire des portes ouvertes (ignorée en debug : tout est refermé à chaque rafraîchissement).
  let opened = new Set();
  if (!DEBUG) { try { opened = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {} }
  const save = () => { if (!DEBUG) { try { localStorage.setItem(KEY, JSON.stringify([...opened])); } catch (e) {} } };

  // Ordre mélangé mais stable (graine fixe) : chaque visiteur voit le même calendrier.
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = mulberry(2412);
  const order = Array.from({ length: DOORS }, (_, i) => i + 1);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }

  // Le contenu d'une porte (lien, titre, accroche) n'est inséré dans la page qu'une fois la porte ouvrable
  // (jour atteint, ou mode ?debug) : avant, le DOM ne contient qu'un cadre vide.
  function inside(n) {
    const c = byNum.get(n);
    if (!c) return `<div class="inside soon" inert><div class="n">${pad(n)}</div><div class="kicker">Surprise</div><p>Une prochaine capsule se cache ici.</p></div>`;
    return `<a class="inside" href="${esc(c.fichier)}" tabindex="-1">
      <div class="n">${pad(n)}</div>
      <div class="kicker">${esc(c.theme)}</div>
      <h2>${esc(c.titre)}</h2>
      <p>${esc(c.accroche)}</p>
      <div class="meta"><span>${c.pages} pages · ${esc(c.duree)}</span><span class="arrow" aria-hidden="true">→</span></div>
    </a>`;
  }

  grid.innerHTML = order.map(n => `
    <div class="door" data-n="${n}">
      <div class="inside pending" inert></div>
      <span class="flash"></span>
      <button class="panel" type="button" aria-label="Porte ${n}">
        <span class="num">${pad(n)}</span><span class="tag"></span>
      </button>
    </div>`).join("");

  function label(door) {
    const n = +door.dataset.n, isOpen = opened.has(n), ok = isOpenable(n);
    if ((ok || isOpen) && door.querySelector(".inside.pending")) door.querySelector(".inside").outerHTML = inside(n);
    door.classList.toggle("open", isOpen);
    door.classList.toggle("locked", !ok && !isOpen);
    door.classList.toggle("ready", ok && !isOpen);
    const panel = door.querySelector(".panel"), inner = door.querySelector(".inside");
    panel.setAttribute("aria-hidden", isOpen);
    panel.tabIndex = isOpen ? -1 : 0;
    panel.setAttribute("aria-label", isOpen ? `Porte ${n} ouverte` : ok ? `Ouvrir la porte ${n}` : `Porte ${n} verrouillée, ouverture le ${n} ${MOIS}`);
    panel.querySelector(".tag").textContent = isOpen ? "" : ok ? "Ouvrir" : `${n} ${MOIS_ABR}`;
    if (inner.tagName === "A") inner.tabIndex = isOpen ? 0 : -1;
    if (isOpen) inner.removeAttribute("aria-hidden"); else inner.setAttribute("aria-hidden", "true");
  }
  function refresh() {
    grid.querySelectorAll(".door").forEach(label);
    const dec = now.getMonth() === M;
    const stats = [[opened.size, "portes ouvertes"], [DOORS - opened.size, "à ouvrir"], [list.length, list.length > 1 ? "capsules" : "capsule"]];
    document.getElementById("stats").innerHTML = stats.map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
    if (DEBUG) msg.innerHTML = "Mode test : toutes les portes s'ouvrent, rien n'est mémorisé.";
    else if (!dec) {
      const first = new Date(now.getFullYear() + (now.getMonth() > M ? 1 : 0), M, 1);
      const days = Math.ceil((first - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
      msg.innerHTML = `Les portes s'ouvrent à partir du <b>1er ${MOIS}</b>${days > 0 ? ` : plus que <b>${days} jour${days > 1 ? "s" : ""}</b>` : ""}.`;
    } else msg.innerHTML = `${TEST ? "Mode test : " : ""}nous sommes le <b>${now.getDate()} ${MOIS}</b> : les portes 1 à ${Math.min(now.getDate(), DOORS)} sont ouvrables.`.replace(/^./, c => c.toUpperCase());
  }

  // ---------- Effet d'ouverture : explosion de particules or + onde de choc ----------
  const fx = document.getElementById("fx"), fctx = fx.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const base = css.getPropertyValue("--particle").trim(), gold = css.getPropertyValue("--accent").trim(), hi = css.getPropertyValue("--accent-hi").trim(), paper = css.getPropertyValue("--paper").trim();
  let FW, FH, sparks = [], rings = [], fxOn = false;
  function fxSize() { const d = Math.min(devicePixelRatio, 2); FW = innerWidth; FH = innerHeight; fx.width = FW * d; fx.height = FH * d; fctx.setTransform(d, 0, 0, d, 0, 0); }
  function burst(x, y) {
    const cols = [gold, hi, paper, base];
    for (let i = 0; i < 160; i++) {
      const a = Math.random() * 6.283, v = 3 + Math.random() * 11;
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, r: .8 + Math.random() * 2.6, life: 1, d: .012 + Math.random() * .016, c: cols[(Math.random() * cols.length) | 0], star: Math.random() < .25 });
    }
    rings.push({ x, y, r: 10, a: 1 }, { x, y, r: 4, a: .7 });
    if (!fxOn) { fxOn = true; requestAnimationFrame(fxLoop); }
  }
  function fxLoop() {
    fctx.clearRect(0, 0, FW, FH);
    for (const g of rings) {
      g.r += 11; g.a *= .93;
      fctx.globalAlpha = g.a; fctx.strokeStyle = gold; fctx.lineWidth = 2;
      fctx.beginPath(); fctx.arc(g.x, g.y, g.r, 0, 6.283); fctx.stroke();
    }
    rings = rings.filter(g => g.a > .03);
    for (const p of sparks) {
      p.vx *= .97; p.vy = p.vy * .97 + .18; p.x += p.vx; p.y += p.vy; p.life -= p.d;
      fctx.globalAlpha = Math.max(p.life, 0); fctx.fillStyle = p.c;
      if (p.star) { fctx.fillRect(p.x - p.r * 2, p.y - .5, p.r * 4, 1); fctx.fillRect(p.x - .5, p.y - p.r * 2, 1, p.r * 4); }
      else { fctx.beginPath(); fctx.arc(p.x, p.y, p.r, 0, 6.283); fctx.fill(); }
    }
    sparks = sparks.filter(p => p.life > 0);
    if (sparks.length || rings.length) requestAnimationFrame(fxLoop); else { fxOn = false; fctx.clearRect(0, 0, FW, FH); }
  }
  fxSize(); addEventListener("resize", fxSize);

  function openDoor(door) {
    const n = +door.dataset.n;
    if (opened.has(n)) return;
    if (!isOpenable(n)) {
      door.classList.remove("shake"); void door.offsetWidth; door.classList.add("shake");
      msg.innerHTML = `Patience : la porte <b>${n}</b> s'ouvrira le <b>${n} ${MOIS}</b>.`;
      return;
    }
    opened.add(n); save();
    if (!reduce) {
      door.classList.add("opening");
      const r = door.getBoundingClientRect();
      setTimeout(() => burst(r.left + r.width / 2, r.top + r.height / 2), 1500);
      setTimeout(() => document.body.classList.add("boom"), 1500);
      setTimeout(() => document.body.classList.remove("boom"), 2020);
      setTimeout(() => door.classList.remove("opening"), 2300);
    }
    label(door); refresh();
  }
  grid.addEventListener("click", e => {
    const st = e.target.closest(".door.stolen"); if (st) return rescue(st);
    const p = e.target.closest(".panel"); if (p) openDoor(p.closest(".door"));
  });
  grid.querySelectorAll(".door.open").forEach(d => d.classList.add("instant"));
  requestAnimationFrame(() => requestAnimationFrame(() => grid.querySelectorAll(".instant").forEach(d => d.classList.remove("instant"))));

  if (DEBUG) {
    document.getElementById("debug").classList.add("on");
    document.getElementById("openAll").onclick = () => { grid.querySelectorAll(".door:not(.open)").forEach((d, i) => setTimeout(() => openDoor(d), i * 90)); };
    document.getElementById("closeAll").onclick = () => { opened.clear(); refresh(); };
  }
  refresh();

  // ---------- Easter egg : le Grinch ----------
  let grinchOn = false, gRunning = false, stolenTimer = 0;
  const GREEN = "#7BC74D", GREEN_DARK = "#2E6B2B";
  function faceCanvas() {
    const S = 300, c = document.createElement("canvas"); c.width = c.height = S;
    const g = c.getContext("2d"), E = (x, y, rx, ry, col, rot = 0) => { g.fillStyle = col; g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, 6.283); g.fill(); };
    E(150, 165, 100, 118, GREEN);                                   // visage
    E(60, 170, 14, 34, GREEN); E(240, 170, 14, 34, GREEN);          // oreilles
    g.strokeStyle = GREEN_DARK; g.lineCap = "round"; g.lineWidth = 15;
    g.beginPath(); g.moveTo(62, 92); g.lineTo(130, 124); g.moveTo(238, 92); g.lineTo(170, 124); g.stroke();   // sourcils en colère
    E(105, 142, 27, 15, "#F2D13D", .25); E(195, 142, 27, 15, "#F2D13D", -.25);  // yeux jaunes
    E(110, 143, 4.5, 13, "#B3261E"); E(190, 143, 4.5, 13, "#B3261E");           // pupilles
    g.strokeStyle = GREEN_DARK; g.lineWidth = 6; g.beginPath(); g.moveTo(150, 150); g.quadraticCurveTo(160, 185, 148, 192); g.stroke();  // nez
    g.fillStyle = "#8A1F26"; g.beginPath(); g.moveTo(66, 212); g.quadraticCurveTo(150, 300, 234, 212); g.quadraticCurveTo(150, 252, 66, 212); g.fill(); // sourire
    g.fillStyle = "#F6F1D2"; g.beginPath(); g.moveTo(84, 219); g.quadraticCurveTo(150, 270, 216, 219); g.quadraticCurveTo(150, 250, 84, 219); g.fill();   // dents
    g.strokeStyle = GREEN_DARK; g.lineWidth = 8; g.beginPath(); g.moveTo(66, 212); g.lineTo(52, 196); g.moveTo(234, 212); g.lineTo(248, 196); g.stroke();
    return { g, S };
  }
  function facePoints() {
    const { g, S } = faceCanvas(), d = g.getImageData(0, 0, S, S).data, pts = [];
    for (let y = 0; y < S; y += 3) for (let x = 0; x < S; x += 3) { const i = (y * S + x) * 4; if (d[i + 3] > 128) pts.push({ tx: x - S / 2 + (Math.random() - .5) * 2.4, ty: y - S / 2 + (Math.random() - .5) * 2.4, c: `rgb(${d[i]},${d[i + 1]},${d[i + 2]})` }); }
    return pts;
  }
  function steal(door, n) {
    door.classList.add("stolen");
    msg.innerHTML = `Le Grinch a volé la porte <b>${n}</b> ! Cliquez dessus pour la récupérer.`;
    stolenTimer = setTimeout(() => { if (door.classList.contains("stolen")) rescue(door); }, 20000);
  }
  function rescue(door) {
    clearTimeout(stolenTimer);
    door.classList.remove("stolen"); grinchOn = false; gRunning = false;
    const r = door.getBoundingClientRect();
    if (!reduce) { burst(r.left + r.width / 2, r.top + r.height / 2); setTimeout(() => burst(r.left + r.width * .2, r.top + r.height * .3), 250); setTimeout(() => burst(r.left + r.width * .8, r.top + r.height * .6), 450); }
    refresh();
    msg.innerHTML = `Noël est sauvé ! La porte <b>${door.dataset.n}</b> est de retour.`;
  }
  function grinch() {
    if (gRunning) return;
    gRunning = true; grinchOn = true;
    const doors = [...grid.querySelectorAll(".door")], door = doors[(Math.random() * doors.length) | 0], n = +door.dataset.n;
    door.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
    if (reduce) return steal(door, n);
    setTimeout(() => {
      const gc = document.createElement("canvas"); gc.setAttribute("aria-hidden", "true");
      gc.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60";
      document.body.appendChild(gc);
      const g = gc.getContext("2d"), d = Math.min(devicePixelRatio, 2), VW = innerWidth, VH = innerHeight;
      gc.width = VW * d; gc.height = VH * d; g.setTransform(d, 0, 0, d, 0, 0);
      const pts = facePoints(), k0 = Math.max(.7, Math.min(1.15, Math.min(VW, VH) / 520));
      const cx = VW / 2, cy = VH * .42, r = door.getBoundingClientRect(), dx = r.left + r.width / 2, dy = r.top + r.height / 2;
      pts.forEach(p => { const a = Math.random() * 6.283, R = 350 + Math.random() * 500; p.sx = cx + Math.cos(a) * R; p.sy = cy + Math.sin(a) * R; p.vx = (Math.random() - .5) * 9; p.vy = -2 - Math.random() * 8; });
      const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, t0 = performance.now();
      let said = false, stolen = false;
      (function frame(now) {
        const t = now - t0;
        g.clearRect(0, 0, VW, VH);
        let X = cx, Y = cy, K = k0, A = 1, form = 1;
        if (t < 1500) form = ease(t / 1500);
        if (t > 1500 && !said) { said = true; msg.innerHTML = `<b style="color:${GREEN}">Le Grinch</b> : « Noël ? Je vais le voler. »`; }
        if (t > 3000 && t <= 4100) { const u = ease((t - 3000) / 1100); X = cx + (dx - cx) * u; Y = cy + (dy - cy) * u; K = k0 * (1 - .5 * u); }
        if (t > 4100) { X = dx; Y = dy; K = k0 * .5; if (!stolen) { stolen = true; steal(door, n); } A = Math.max(0, 1 - (t - 4100) / 1000); }
        for (const p of pts) {
          let x, y;
          if (t <= 4100) {
            const tx = X + p.tx * K + (t > 1500 ? Math.sin(t * .006 + p.tx) * 1.2 : 0), ty = Y + p.ty * K + (t > 1500 ? Math.cos(t * .005 + p.ty) * 1.2 : 0);
            x = p.sx + (tx - p.sx) * form; y = p.sy + (ty - p.sy) * form;
          } else { const u = (t - 4100) / 16; x = X + p.tx * K + p.vx * u; y = Y + p.ty * K + p.vy * u + u * u * .02; }
          g.globalAlpha = A * (.35 + .65 * form); g.fillStyle = p.c;
          g.beginPath(); g.arc(x, y, 1.5, 0, 6.283); g.fill();
        }
        if (t < 5200) requestAnimationFrame(frame); else gc.remove();
      })(t0);
    }, 700);
  }
  // Déclencheurs : Konami code, ou trois clics rapides sur « IA » dans le titre.
  const KONAMI = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
  let ki = 0;
  addEventListener("keydown", e => { ki = e.key === KONAMI[ki] ? ki + 1 : (e.key === KONAMI[0] ? 1 : 0); if (ki === KONAMI.length) { ki = 0; grinch(); } });
  let clicks = [];
  document.querySelector("header.hero h1 span").addEventListener("click", () => { const now = Date.now(); clicks = clicks.filter(t => now - t < 900).concat(now); if (clicks.length >= 3) { clicks = []; grinch(); } });

  // ---------- Champ de particules en fond ----------
  const cv = document.getElementById("field"), ctx = cv.getContext("2d");
  let W, H, P = [], mx = .5, my = .5;
  function size() {
    const dpr = Math.min(devicePixelRatio, 2);
    W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(W * H / 5200);
    P = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, z: .3 + Math.random() * .7, s: Math.random() * 6.28, g: Math.random() < .08 }));
  }
  addEventListener("pointermove", e => { mx = e.clientX / W; my = e.clientY / H; }, { passive: true });
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    const sy = scrollY * .15;
    for (const p of P) {
      const x = (p.x + Math.sin(t * .0004 + p.s) * 14 * p.z + (mx - .5) * 30 * p.z + W) % W;
      const fall = reduce ? 0 : t * .025 * p.z; // chute lente, plus rapide pour les flocons proches
      const y = ((p.y + fall - sy * p.z) % H + H) % H;
      ctx.globalAlpha = p.g ? .9 : .25 + p.z * .35;
      ctx.fillStyle = grinchOn ? (p.g ? "#B8F27C" : GREEN) : (p.g ? gold : base);
      ctx.beginPath(); ctx.arc(x, y, p.g ? 1.6 : .6 + p.z * .9, 0, 6.283); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  size(); addEventListener("resize", () => { size(); if (reduce) draw(0); });
  requestAnimationFrame(draw);
})();
</script>
</body>
